name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Nether collects no telemetry, and neither do its tools here.
  TURBO_TELEMETRY_DISABLED: "1"
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Lint, types, tests and builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check
      - name: Types
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build the server, the desktop page and the documentation site
        run: pnpm build
      # The Phase 0 gate: the server runs with every enterprise feature off.
      - name: Run the server with every enterprise feature off
        run: pnpm --filter @nether/server smoke

  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Test the license policy
        run: node --test ".github/scripts/*.test.mjs"
      - name: Check every dependency's license against ADR 0001
        run: node .github/scripts/check-licenses.mjs

  go:
    name: Desktop Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - name: Formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet for Linux, Windows and macOS
        run: |
          GOOS=linux go vet ./...
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...
      - name: Test
        run: go test ./...
      - name: The generated TypeScript client is up to date
        if: runner.os == 'Linux'
        run: |
          go tool mygo generate
          git diff --exit-code -- src/mygo.ts

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: [check, go]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, platform: linux/amd64 }
          - { name: windows-amd64, platform: windows/amd64 }
          - { name: darwin-universal, platform: darwin/universal }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Install NSIS, for the Windows installer
        if: matrix.name == 'windows-amd64'
        run: sudo apt-get update && sudo apt-get install -y nsis
      # MyGO needs no cgo, so Linux builds every platform. These builds are
      # not signed; releases sign theirs.
      - name: Build
        working-directory: apps/desktop
        run: go tool mygo build -platform "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v7
        with:
          name: nether-desktop-${{ matrix.name }}
          path: apps/desktop/build/
          retention-days: 7

  # The Linux build as an AppImage and a Flatpak, made from the files of the
  # desktop job's build, as releases make them.
  appimage:
    name: AppImage
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: nether-desktop-linux-amd64
          path: apps/desktop/build
      - name: Fetch appimagetool 1.9.1
        run: |
          curl -fsSLo /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool" | sha256sum -c -
          chmod +x /tmp/appimagetool
      - name: Build the AppImage
        working-directory: apps/desktop
        run: sh packaging/appimage.sh build/linux-amd64 /tmp/appimagetool
      - uses: actions/upload-artifact@v7
        with:
          name: nether-appimage
          path: apps/desktop/build/linux-amd64/*.AppImage
          retention-days: 7

  flatpak:
    name: Flatpak
    needs: desktop
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: nether-desktop-linux-amd64
          path: apps/desktop/build
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: nether.flatpak
          manifest-path: apps/desktop/packaging/flatpak/io.github.fzn0x.Nether.yml
          cache: false

  # The performance targets on the reference vault of 50,000 notes: title
  # and full-text search, and reading a note, with the app's own code.
  perf:
    name: Performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Measure on the reference vault
        run: pnpm perf:bench --out "$GITHUB_WORKSPACE/perf-report.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-report
          path: perf-report.json
          retention-days: 30

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @nether/desktop exec playwright install --with-deps chromium
      - name: The desktop page in Chromium
        run: pnpm --filter @nether/desktop test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/desktop/playwright-report/
          retention-days: 7

  commits:
    name: Commit messages and sign-offs
    # Dependabot's updates carry no sign-off: the DCO is for contributions.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Conventional Commits, and the Signed-off-by line the DCO asks for.
      - name: Check every commit of the pull request
        run: >-
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
