name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. Please do not report security problems here;
        see [SECURITY.md](https://github.com/fzn0x/nether/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The fewest steps that show it. Attach a sample note or vault if it helps, with anything private removed.
  - type: dropdown
    id: part
    attributes:
      label: Which part of Nether?
      options:
        - Desktop app
        - Server
        - Web app
        - Mobile app
        - Documentation
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nether version or commit
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
