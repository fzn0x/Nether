packages:
  - apps/*
  - packages/*
  - enterprise/*
  - tools/*

# Supply-chain hardening: only resolve versions that have been public for 7 days.
minimumReleaseAge: 10080

onlyBuiltDependencies:
  - lefthook

overrides:
  # Mermaid's ELK layout is under the EPL-2.0, which the AGPL does not allow:
  # a stand-in takes its place (ADR 0009).
  elkjs: link:./tools/stubs/elkjs
